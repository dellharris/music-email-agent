<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Idu House · Music AI Agent</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#0a0704;color:#f5ede0;font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:grid;grid-template-columns:320px 1fr;grid-template-rows:auto 1fr;}

    /* ── LEFT SIDEBAR ── */
    .sidebar{grid-row:1/3;background:#0e0905;border-right:1px solid rgba(201,160,94,0.15);display:flex;flex-direction:column;align-items:center;padding:32px 24px;}
    .agent-halo{width:180px;height:180px;border-radius:50%;border:2px solid rgba(201,160,94,0.4);background:radial-gradient(circle at 50% 40%,#1e1108,#0a0704);display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:20px;box-shadow:0 0 40px rgba(201,160,94,0.12),0 0 80px rgba(201,160,94,0.06);overflow:hidden;}
    .agent-halo img{width:190px;height:190px;object-fit:cover;object-position:50% 15%;margin-top:20px;}
    .agent-halo::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 -30px 40px rgba(10,7,4,0.7);pointer-events:none;}
    .pulse{position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(201,160,94,0.25);animation:pulse 3s ease-in-out infinite;}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:0.5;}50%{transform:scale(1.04);opacity:1;}}
    .agent-name{color:#f5ede0;font-family:Georgia,serif;font-size:17px;font-weight:normal;text-align:center;margin-bottom:6px;}
    .agent-role{color:#c9a05e;font-family:Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:28px;}
    .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4caf50;margin-right:6px;box-shadow:0 0 8px #4caf50;animation:blink 2s ease-in-out infinite;}
    @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.4;}}
    .status{color:#7a5a38;font-family:Arial,sans-serif;font-size:11px;display:flex;align-items:center;margin-bottom:32px;}
    .sidebar-divider{width:100%;border:none;border-top:1px solid rgba(201,160,94,0.1);margin-bottom:24px;}
    .stat-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:32px;}
    .stat-box{background:#1a0f06;border:1px solid rgba(201,160,94,0.12);border-radius:4px;padding:12px;text-align:center;}
    .stat-val{color:#c9a05e;font-family:Arial,sans-serif;font-size:20px;font-weight:700;line-height:1;}
    .stat-lbl{color:#4a3520;font-family:Arial,sans-serif;font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-top:4px;}
    .sidebar-label{color:#4a3520;font-family:Arial,sans-serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;width:100%;}

    /* ── SEED QUEUE IN SIDEBAR ── */
    .seed-form textarea,.seed-form input{width:100%;background:#0a0704;border:1px solid rgba(201,160,94,0.2);border-radius:2px;color:#f5ede0;font-family:Georgia,serif;font-size:12px;padding:9px 11px;resize:vertical;outline:none;margin-bottom:8px;}
    .seed-form textarea{min-height:70px;}
    .seed-form textarea:focus,.seed-form input:focus{border-color:#c9a05e;}
    .btn-seed{background:#c9a05e;color:#1e1108;font-family:Arial,sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;border:none;padding:9px;border-radius:2px;font-weight:700;cursor:pointer;width:100%;margin-bottom:16px;}
    .btn-seed:hover{background:#e8c070;}
    .seed-item{background:#1a0f06;border:1px solid rgba(201,160,94,0.1);border-radius:3px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
    .seed-item.used{opacity:0.4;}
    .seed-txt{color:#b09a80;font-family:Arial,sans-serif;font-size:11px;line-height:1.45;flex:1;}
    .seed-date{color:#4a3520;font-size:10px;font-family:Arial,sans-serif;margin-top:2px;}
    .btn-del{background:none;border:1px solid rgba(201,160,94,0.15);color:#4a3520;font-size:9px;padding:3px 6px;border-radius:2px;cursor:pointer;font-family:Arial,sans-serif;white-space:nowrap;}
    .btn-del:hover{border-color:#c9a05e;color:#c9a05e;}
    .queue-badge{background:#c9a05e;color:#1e1108;font-family:Arial,sans-serif;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:6px;}

    /* ── TOP BAR ── */
    .topbar{background:#0e0905;border-bottom:1px solid rgba(201,160,94,0.1);padding:16px 36px;display:flex;align-items:center;justify-content:space-between;}
    .topbar-title{color:#c9a05e;font-family:Arial,sans-serif;font-size:10px;letter-spacing:4px;text-transform:uppercase;}
    .topbar-sub{color:#4a3520;font-family:Arial,sans-serif;font-size:11px;}

    /* ── CAMPAIGNS ── */
    .campaigns{padding:32px 36px;overflow-y:auto;}
    .campaigns-label{color:#c9a05e;font-family:Arial,sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;margin-bottom:20px;}
    .campaign-card{background:#1a0f06;border:1px solid rgba(201,160,94,0.12);border-radius:4px;padding:18px 22px;margin-bottom:12px;transition:border-color 0.2s;}
    .campaign-card:hover{border-color:rgba(201,160,94,0.4);}
    .campaign-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px;}
    .campaign-info h3{color:#f5ede0;font-size:14px;font-family:Georgia,serif;font-weight:normal;margin-bottom:4px;}
    .campaign-info .sub{color:#b09a80;font-family:Arial,sans-serif;font-size:11px;margin-bottom:3px;}
    .campaign-info .date{color:#4a3520;font-family:Arial,sans-serif;font-size:10px;}
    .btn-preview{background:#c9a05e;color:#1e1108;font-family:Arial,sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;padding:7px 14px;border-radius:2px;font-weight:700;white-space:nowrap;}
    .btn-preview:hover{background:#e8c070;}
    .metrics{display:flex;gap:20px;flex-wrap:wrap;border-top:1px solid rgba(201,160,94,0.08);padding-top:12px;}
    .metric{text-align:center;}
    .metric-val{color:#c9a05e;font-family:Arial,sans-serif;font-size:18px;font-weight:700;line-height:1;}
    .metric-val.hi{color:#e8c070;}
    .metric-lbl{color:#4a3520;font-family:Arial,sans-serif;font-size:8px;letter-spacing:1px;text-transform:uppercase;margin-top:3px;}
    .metrics-na{color:#4a3520;font-family:Arial,sans-serif;font-size:11px;border-top:1px solid rgba(201,160,94,0.08);padding-top:10px;}
    .empty{color:#4a3520;font-family:Arial,sans-serif;font-size:13px;text-align:center;padding:48px;border:1px dashed rgba(201,160,94,0.1);border-radius:4px;}
  </style>
</head>

    <div class="agent-name">Music AI Agent</div>
    <div class="agent-role">Idu House · Newsletter Intelligence</div>
    <div class="status"><span class="status-dot"></span>Active &amp; Listening</div>

    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val" id="total-sent">—</div><div class="stat-lbl">Campaigns</div></div>
      <div class="stat-box"><div class="stat-val" id="total-opens">—</div><div class="stat-lbl">Total Opens</div></div>
      <div class="stat-box"><div class="stat-val" id="avg-open">—</div><div class="stat-lbl">Avg Open%</div></div>
      <div class="stat-box"><div class="stat-val" id="total-clicks">—</div><div class="stat-lbl">Clicks</div></div>
    </div>

    <hr class="sidebar-divider">

    <div class="sidebar-label">Seed Queue <span class="queue-badge" id="queue-count">{{QUEUE_COUNT}}</span></div>
    <div class="seed-form">
      <form method="POST" action="/seeds/add">
        <textarea name="content" placeholder="Drop an article, angle, or topic for the next send..."></textarea>
        <input type="text" name="source_url" placeholder="Source URL (optional)">
        <button type="submit" class="btn-seed">Queue It</button>
      </form>
    </div>
    {{PENDING_SEEDS}}
    {{USED_SEEDS}}
  </aside>

  <!-- TOPBAR -->
  <header class="topbar">
    <span class="topbar-title">Newsletter Dashboard</span>
    <span class="topbar-sub">Music × AI Insider · Idu House</span>
  </header>

  <!-- CAMPAIGNS -->
  <main class="campaigns">
    <div class="campaigns-label">Sent Campaigns</div>
    {{CAMPAIGNS}}
  </main>

  <script>
    // Roll up sidebar stats from campaign cards
    window.addEventListener('DOMContentLoaded', () => {
      const vals = document.querySelectorAll('[data-opens]');
      let totalSent=0, totalOpens=0, totalClicks=0, openRates=[], count=0;
      vals.forEach(el => {
        totalSent += +el.dataset.sent||0;
        totalOpens += +el.dataset.opens||0;
        totalClicks += +el.dataset.clicks||0;
        if(el.dataset.openrate) openRates.push(+el.dataset.openrate);
        count++;
      });
      document.getElementById('total-sent').textContent = count||'—';
      document.getElementById('total-opens').textContent = totalOpens||'—';
      document.getElementById('total-clicks').textContent = totalClicks||'—';
      const avg = openRates.length ? (openRates.reduce((a,b)=>a+b,0)/openRates.length).toFixed(1)+'%' : '—';
      document.getElementById('avg-open').textContent = avg;
    });
  </script>
</body>
</html>
