<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0905"/>
      <stop offset="100%" style="stop-color:#2a1c0f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c070"/>
      <stop offset="100%" style="stop-color:#a07830"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a"/>
      <stop offset="100%" style="stop-color:#0a1a12"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="320" fill="url(#bg)"/>

  <!-- Circuit grid lines -->
  <g opacity="0.08" stroke="#c9a05e" stroke-width="0.5">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="60" y1="0" x2="60" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="320"/>
    <line x1="180" y1="0" x2="180" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="360" y1="0" x2="360" y2="320"/>
    <line x1="420" y1="0" x2="420" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="540" y1="0" x2="540" y2="320"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#c9a05e" opacity="0.15">
    <circle cx="60" cy="80" r="3"/><circle cx="120" cy="40" r="2"/><circle cx="180" cy="120" r="3"/>
    <circle cx="480" cy="80" r="3"/><circle cx="540" cy="120" r="2"/><circle cx="420" cy="40" r="3"/>
    <circle cx="60" cy="240" r="2"/><circle cx="540" cy="280" r="3"/><circle cx="480" cy="240" r="2"/>
  </g>

  <!-- Desk surface -->
  <rect x="80" y="230" width="440" height="8" rx="2" fill="#3d2510" opacity="0.8"/>
  <rect x="80" y="238" width="440" height="60" rx="2" fill="#1a0f06" opacity="0.6"/>

  <!-- Monitor stand -->
  <rect x="283" y="195" width="34" height="38" rx="3" fill="#2a1c0f"/>
  <rect x="263" y="230" width="74" height="6" rx="3" fill="#3a2818"/>

  <!-- Monitor -->
  <rect x="155" y="100" width="290" height="140" rx="6" fill="#1e1108" stroke="#c9a05e" stroke-width="1.5" opacity="0.9"/>
  <rect x="162" y="107" width="276" height="126" rx="4" fill="url(#screen)"/>

  <!-- Screen content — email being written -->
  <g filter="url(#glow)">
    <!-- Email lines -->
    <rect x="172" y="118" width="80" height="3" rx="1.5" fill="#c9a05e" opacity="0.9"/>
    <rect x="172" y="127" width="180" height="2.5" rx="1.2" fill="#c9a05e" opacity="0.5"/>
    <rect x="172" y="135" width="140" height="2.5" rx="1.2" fill="#c9a05e" opacity="0.4"/>
    <rect x="172" y="143" width="220" height="2.5" rx="1.2" fill="#c9a05e" opacity="0.5"/>
    <rect x="172" y="151" width="160" height="2.5" rx="1.2" fill="#c9a05e" opacity="0.35"/>
    <rect x="172" y="159" width="200" height="2.5" rx="1.2" fill="#c9a05e" opacity="0.4"/>
    <rect x="172" y="167" width="130" height="2.5" rx="1.2" fill="#c9a05e" opacity="0.3"/>
    <rect x="172" y="178" width="100" height="8" rx="2" fill="#c9a05e" opacity="0.7"/>
    <!-- Send button glow -->
    <rect x="172" y="178" width="100" height="8" rx="2" fill="#c9a05e" opacity="0.2" filter="url(#softglow)"/>
    <!-- Cursor blink -->
    <rect x="306" y="167" width="2" height="8" rx="1" fill="#c9a05e" opacity="0.9"/>
  </g>

  <!-- Android body — torso -->
  <rect x="256" y="60" width="88" height="44" rx="8" fill="#1e1108" stroke="#c9a05e" stroke-width="1.5"/>

  <!-- Android head -->
  <rect x="268" y="30" width="64" height="50" rx="10" fill="#1e1108" stroke="#c9a05e" stroke-width="1.5"/>

  <!-- Antenna -->
  <line x1="300" y1="30" x2="300" y2="18" stroke="#c9a05e" stroke-width="1.5"/>
  <circle cx="300" cy="15" r="4" fill="#c9a05e" filter="url(#softglow)"/>

  <!-- Eyes -->
  <g filter="url(#glow)">
    <rect x="278" y="45" width="14" height="8" rx="4" fill="#c9a05e"/>
    <rect x="308" y="45" width="14" height="8" rx="4" fill="#c9a05e"/>
    <rect x="278" y="45" width="14" height="8" rx="4" fill="#c9a05e" opacity="0.4" filter="url(#softglow)"/>
    <rect x="308" y="45" width="14" height="8" rx="4" fill="#c9a05e" opacity="0.4" filter="url(#softglow)"/>
  </g>

  <!-- Mouth indicator -->
  <rect x="285" y="62" width="30" height="3" rx="1.5" fill="#c9a05e" opacity="0.4"/>

  <!-- Chest panel -->
  <rect x="268" y="70" width="64" height="26" rx="4" fill="#0a0704" opacity="0.6"/>
  <g filter="url(#glow)" opacity="0.8">
    <rect x="274" y="76" width="16" height="3" rx="1.5" fill="#c9a05e"/>
    <rect x="274" y="83" width="24" height="3" rx="1.5" fill="#c9a05e" opacity="0.6"/>
    <circle cx="312" cy="82" r="5" fill="none" stroke="#c9a05e" stroke-width="1.5"/>
    <circle cx="312" cy="82" r="2" fill="#c9a05e"/>
  </g>

  <!-- Left arm — reaching toward keyboard -->
  <path d="M256 76 Q220 90 200 220" stroke="#c9a05e" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M256 76 Q220 90 200 220" stroke="#0e0905" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Left hand -->
  <ellipse cx="200" cy="224" rx="14" ry="8" rx="10" fill="#1e1108" stroke="#c9a05e" stroke-width="1.5" opacity="0.9"/>
  <g opacity="0.8" stroke="#c9a05e" stroke-width="1" fill="none">
    <line x1="195" y1="220" x2="192" y2="214"/>
    <line x1="200" y1="218" x2="199" y2="212"/>
    <line x1="205" y1="220" x2="205" y2="213"/>
    <line x1="210" y1="222" x2="212" y2="216"/>
  </g>

  <!-- Right arm — also at keyboard -->
  <path d="M344 76 Q380 90 400 220" stroke="#c9a05e" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M344 76 Q380 90 400 220" stroke="#0e0905" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Right hand -->
  <ellipse cx="400" cy="224" rx="14" ry="8" fill="#1e1108" stroke="#c9a05e" stroke-width="1.5" opacity="0.9"/>
  <g opacity="0.8" stroke="#c9a05e" stroke-width="1" fill="none">
    <line x1="395" y1="220" x2="392" y2="214"/>
    <line x1="400" y1="218" x2="399" y2="212"/>
    <line x1="405" y1="220" x2="405" y2="213"/>
    <line x1="410" y1="222" x2="412" y2="216"/>
  </g>

  <!-- Keyboard -->
  <rect x="160" y="224" width="280" height="14" rx="3" fill="#2a1c0f" stroke="#c9a05e" stroke-width="1" opacity="0.9"/>
  <g fill="#3d2510" opacity="0.9">
    <rect x="166" y="227" width="12" height="8" rx="1.5"/>
    <rect x="182" y="227" width="12" height="8" rx="1.5"/>
    <rect x="198" y="227" width="12" height="8" rx="1.5"/>
    <rect x="214" y="227" width="12" height="8" rx="1.5"/>
    <rect x="230" y="227" width="12" height="8" rx="1.5"/>
    <rect x="246" y="227" width="40" height="8" rx="1.5"/>
    <rect x="290" y="227" width="12" height="8" rx="1.5"/>
    <rect x="306" y="227" width="12" height="8" rx="1.5"/>
    <rect x="322" y="227" width="12" height="8" rx="1.5"/>
    <rect x="338" y="227" width="12" height="8" rx="1.5"/>
    <rect x="354" y="227" width="12" height="8" rx="1.5"/>
    <rect x="370" y="227" width="18" height="8" rx="1.5"/>
  </g>

  <!-- Floating email icons -->
  <g opacity="0.6" filter="url(#glow)">
    <!-- Email 1 -->
    <g transform="translate(90,130)">
      <rect width="36" height="24" rx="3" fill="none" stroke="#c9a05e" stroke-width="1.2"/>
      <polyline points="0,0 18,14 36,0" fill="none" stroke="#c9a05e" stroke-width="1.2"/>
    </g>
    <!-- Email 2 -->
    <g transform="translate(474,110)" opacity="0.5">
      <rect width="28" height="18" rx="2" fill="none" stroke="#c9a05e" stroke-width="1"/>
      <polyline points="0,0 14,10 28,0" fill="none" stroke="#c9a05e" stroke-width="1"/>
    </g>
    <!-- Email 3 -->
    <g transform="translate(500,160)" opacity="0.35">
      <rect width="22" height="14" rx="2" fill="none" stroke="#c9a05e" stroke-width="0.8"/>
      <polyline points="0,0 11,8 22,0" fill="none" stroke="#c9a05e" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Floating dots — signal/transmission -->
  <g fill="#c9a05e" filter="url(#softglow)">
    <circle cx="100" cy="175" r="2.5" opacity="0.7"/>
    <circle cx="115" cy="168" r="1.8" opacity="0.5"/>
    <circle cx="130" cy="162" r="1.2" opacity="0.35"/>
    <circle cx="500" cy="150" r="2.5" opacity="0.6"/>
    <circle cx="515" cy="143" r="1.8" opacity="0.4"/>
    <circle cx="530" cy="137" r="1.2" opacity="0.25"/>
  </g>

  <!-- Label -->
  <text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" letter-spacing="4" text-transform="uppercase" fill="#c9a05e" opacity="0.6">AUTOMATED · CONSISTENT · ON BRAND</text>
</svg>
